<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Projects - CodeAI</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/projects.css">
    <link rel="stylesheet" href="vendor/highlight/highlight-theme.css">
</head>
<body class="pc-page">
    <div class="pc-shell">
        <header class="pc-topbar">
            <div class="pc-topbar-left">
                <a href="index.html" class="pc-brand" aria-label="CodeAI">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                    <span>CodeAI</span>
                </a>
                <span class="pc-topbar-divider"></span>
                <a href="index.html" class="pc-back-link" data-i18n="proj.backHall">Về sảnh</a>
            </div>
            <div class="pc-topbar-right">
                <button type="button" class="pc-icon-btn pc-theme-toggle" aria-label="Theme">
                    <svg class="pc-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                    <svg class="pc-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
                </button>
                <div class="pc-user">
                    <span class="pc-avatar" id="userAvatar">C</span>
                    <span class="pc-user-name" id="userName">...</span>
                </div>
            </div>
        </header>

        <main class="pc-main">
            <section class="pc-hero">
                <div>
                    <h1 data-i18n="proj.title">Dự án của tôi</h1>
                    <p class="pc-subtitle" id="projectStats"></p>
                </div>
                <div class="pc-hero-actions">
                    <span class="pc-quota" id="quotaBadge"></span>
                    <button type="button" class="pc-btn pc-btn-primary" id="newProjectBtn">
                        <span class="pc-plus">+</span>
                        <span data-i18n="proj.new">Dự án mới</span>
                    </button>
                </div>
            </section>

            <section class="pc-toolbar">
                <label class="pc-search">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
                    <input type="search" id="projectSearch" data-i18n-placeholder="proj.search" placeholder="Tìm theo tên dự án...">
                </label>
                <select class="pc-select pc-scope" id="projectScope">
                    <option value="mine" data-i18n="proj.scope.mine">Của tôi</option>
                    <option value="public" data-i18n="proj.scope.public">Cộng đồng</option>
                </select>
                <div class="pc-filter-tabs" id="filterTabs">
                    <button type="button" class="active" data-state="active" data-i18n="proj.filter.all">Tất cả</button>
                    <button type="button" data-state="public" data-i18n="proj.filter.public">Public</button>
                    <button type="button" data-state="private" data-i18n="proj.filter.private">Private</button>
                    <button type="button" data-state="archived" data-i18n="proj.filter.archived">Archived</button>
                </div>
                <select class="pc-select pc-sort" id="projectSort">
                    <option value="updated" data-i18n="proj.sort.updated">Mới cập nhật</option>
                    <option value="created" data-i18n="proj.sort.created">Mới tạo</option>
                    <option value="name" data-i18n="proj.sort.name">Tên A-Z</option>
                </select>
            </section>

            <section class="pc-grid" id="projectsGrid"></section>

            <section class="pc-empty hidden" id="emptyState">
                <div class="pc-empty-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                </div>
                <h2 id="emptyTitle" data-i18n="proj.empty.title">Chưa có dự án nào</h2>
                <p id="emptyDesc" data-i18n="proj.empty.desc">Tạo dự án đầu tiên để lưu code và chia sẻ với người khác.</p>
                <button type="button" class="pc-btn pc-btn-primary" id="emptyCreateBtn" data-i18n="proj.new">Dự án mới</button>
            </section>
        </main>
    </div>

    <div class="pc-modal-backdrop" id="projectModal">
        <form class="pc-modal" id="projectForm">
            <div class="pc-modal-head">
                <div>
                    <h2 id="projectModalTitle" data-i18n="proj.modal.new.title">Dự án mới</h2>
                    <p class="pc-modal-sub" id="quotaHint"></p>
                </div>
                <button type="button" class="pc-icon-btn" id="projectModalClose" aria-label="Close">×</button>
            </div>
            <div class="pc-modal-body">
                <label class="pc-field">
                    <span data-i18n="proj.field.name">Tên dự án</span>
                    <input class="pc-input" id="projectName" maxlength="120" required data-i18n-placeholder="proj.field.name.placeholder" placeholder="Ví dụ: Portfolio Website">
                </label>
                <label class="pc-field">
                    <span data-i18n="proj.field.description">Mô tả</span>
                    <textarea class="pc-textarea" id="projectDescription" maxlength="5000" rows="4" data-i18n-placeholder="proj.field.description.placeholder" placeholder="Mô tả ngắn về dự án..."></textarea>
                </label>
                <div class="pc-field">
                    <span data-i18n="proj.field.visibility">Hiển thị</span>
                    <div class="pc-visibility-grid">
                        <label class="pc-visibility-card">
                            <input type="radio" name="visibility" value="private" checked>
                            <span class="pc-visibility-icon is-private">P</span>
                            <span>
                                <strong data-i18n="proj.visibility.private">Private</strong>
                                <small data-i18n="proj.visibility.private.hint">Chỉ bạn và người có link chia sẻ xem được.</small>
                            </span>
                        </label>
                        <label class="pc-visibility-card">
                            <input type="radio" name="visibility" value="public">
                            <span class="pc-visibility-icon is-public">P</span>
                            <span>
                                <strong data-i18n="proj.visibility.public">Public</strong>
                                <small data-i18n="proj.visibility.public.hint">Mọi người dùng đã đăng nhập đều xem được.</small>
                            </span>
                        </label>
                    </div>
                </div>
            </div>
            <div class="pc-modal-foot">
                <button type="button" class="pc-btn pc-btn-ghost" id="projectModalCancel" data-i18n="proj.action.cancel">Hủy</button>
                <button type="submit" class="pc-btn pc-btn-primary" id="projectSubmitBtn" data-i18n="proj.action.create">Tạo dự án</button>
            </div>
        </form>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/projects-common.js"></script>
    <script src="js/project-ws.js"></script>
    <script src="js/projects.js"></script>
</body>
</html>
