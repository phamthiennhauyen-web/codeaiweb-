<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casio tools - CodeAI</title>
    <script>try{if(localStorage.getItem('codeai_theme')==='dark')document.documentElement.classList.add('theme-dark');}catch(e){}</script>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/hall.css">
    <link rel="stylesheet" href="css/casio.css">
</head>
<body class="casio-body">
    <header class="topbar casio-topbar">
        <div class="casio-top-left">
            <a href="index.html" class="icon-btn" data-i18n-title="casio.backHall" aria-label="Back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>
            <a href="index.html" class="brand casio-brand" aria-label="CodeAI">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></svg>
                <span class="brand-name">CodeAI</span>
            </a>
            <span class="casio-divider"></span>
            <span class="casio-current" data-i18n="casio.backTools">Casio tools</span>
        </div>
        <div class="topbar-right">
            <button type="button" class="icon-btn casio-theme-toggle" data-i18n-title="editor.theme.toggle" aria-label="Theme">
                <svg class="ico-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                <svg class="ico-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
            </button>
            <span class="casio-user" id="userName">...</span>
            <button type="button" class="casio-logout" id="logoutBtn" data-i18n="hall.logout">Đăng xuất</button>
        </div>
    </header>

    <main class="casio-main">
        <section class="casio-hero">
            <span class="casio-kicker">CASIO</span>
            <h1 data-i18n="casio.title">CASIO TOOLS</h1>
            <p data-i18n="casio.subtitle">Bộ công cụ dành cho máy tính CASIO</p>
        </section>

        <section class="casio-grid">
            <a class="casio-card casio-card-active" href="casio-compiler.html">
                <span class="casio-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="11" x2="8" y2="11"/><line x1="12" y1="11" x2="12" y2="11"/><line x1="16" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="8" y2="15"/><line x1="12" y1="15" x2="12" y2="15"/><line x1="16" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="8" y2="19"/><line x1="12" y1="19" x2="12" y2="19"/><line x1="16" y1="19" x2="16" y2="19"/></svg>
                </span>
                <span class="casio-card-content">
                    <strong data-i18n="casio.compiler.name">Compiler</strong>
                    <span data-i18n="casio.compiler.desc">Dịch assembly cho fx-580VN X và fx-880BTG</span>
                </span>
                <span class="casio-card-open">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                </span>
            </a>

            <button type="button" class="casio-card is-soon" data-soon>
                <span class="casio-badge" data-i18n="casio.soonBadge">SẮP CÓ</span>
                <span class="casio-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M7 7V5h10v2"/><path d="M6 7l1 13h10l1-13"/><path d="M10 11h4"/></svg>
                </span>
                <span class="casio-card-content">
                    <strong data-i18n="casio.token.name">Dịch token</strong>
                    <span data-i18n="casio.token.desc">Chuyển đổi token cho CASIO</span>
                </span>
            </button>

            <button type="button" class="casio-card is-soon" data-soon>
                <span class="casio-badge" data-i18n="casio.soonBadge">SẮP CÓ</span>
                <span class="casio-card-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18v3h3l6.3-6.3a4 4 0 0 0 5.4-5.4l-2.3 2.3-2.4-2.4z"/></svg>
                </span>
                <span class="casio-card-content">
                    <strong data-i18n="casio.tools.name">Tools</strong>
                    <span data-i18n="casio.tools.desc">Các tiện ích khác cho CASIO</span>
                </span>
            </button>
        </section>
    </main>

    <div class="toast" id="toast"></div>

    <script src="js/theme.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/casio.js"></script>
</body>
</html>
